# @path: harst/Cargo.toml
# @author: redskaber
# @datetime: 2026-09-30
# @description:
#  karst compiler - Cargo workspace root manifast.


[workspace]
resolver = "3"
members = [
  "crates/karst_core",
  "crates/karst_expander",
  "crates/karst_reader",
  "crates/karst_span",
  "crates/karst_syntax",
]

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
authors = ["redskaber"]

[package]
name = "karst"
description = "karst compiler -- root aggregation crate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
karst_span = { path = "crates/karst_span" }
karst_expander = { path = "crates/karst_expander" }
karst_syntax = { path = "crates/karst_syntax" }
karst_core = { path = "crates/karst_core" }
karst_reader = { path = "crates/karst_reader" }

[[example]]
name = "stage0_gate_audit_r1"
path = "examples/audit/stage0_gate_audit_r1.rs"
